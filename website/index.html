<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- The favicon used to be the 1536x1536, 2 MB icon.png: two megabytes
         downloaded by every visitor to draw a 16-pixel square. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Dark Reader Extension Lock & Theme Meta -->
    <meta name="darkreader-lock" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#09090b" />

    <!-- Primary SEO Meta Tags -->
    <title>LoginLens — Your Identity Vault. No Backend.</title>
    <meta name="title" content="LoginLens — Your Identity Vault. No Backend." />
    <meta name="description" content="LoginLens is a privacy-first, open-source browser extension that automatically tracks OAuth logins, keeps your identity vault in your own browser, and maps your digital identity. No account, no backend, no telemetry." />
    <meta name="keywords" content="LoginLens, browser extension, password manager, OAuth tracker, identity vault, Chrome extension, Firefox extension, Edge extension, privacy, local storage, open source, MV3, offline decryptor" />
    <meta name="author" content="Life Experimentalist" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://loginlens.vkrishna04.me/" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://loginlens.vkrishna04.me/" />
    <meta property="og:title" content="LoginLens — Your Identity Vault. No Backend." />
    <meta property="og:description" content="Privacy-first OAuth tracking and credential management. Your vault lives in your browser. No account, no backend, no telemetry — and sync stays off until you turn it on." />
    <meta property="og:image" content="https://loginlens.vkrishna04.me/social_banner.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <!-- Read aloud in place of the banner by a screen reader, and by anything
         that cannot load the image at all. -->
    <meta property="og:image:alt" content="LoginLens — a local-only map of how you sign in to everything." />
    <meta property="og:site_name" content="LoginLens" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://loginlens.vkrishna04.me/" />
    <meta name="twitter:title" content="LoginLens — Your Identity Vault. No Backend." />
    <meta name="twitter:description" content="Privacy-first browser extension for OAuth tracking and local credential storage. No account, no backend, no telemetry. Open source." />
    <meta name="twitter:image" content="https://loginlens.vkrishna04.me/social_banner.png" />
    <meta name="twitter:image:alt" content="LoginLens — a local-only map of how you sign in to everything." />

    <!-- Application Metadata -->
    <meta name="application-name" content="LoginLens" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="LoginLens" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- JSON-LD Structured Data (Schema.org) for SEO & AI Assistants is not
         written here: it differs per page, and a single copy in the template
         would put the homepage's "this page is the extension" claim on /docs
         and /decrypt too. `src/routes.ts` holds one graph per route and
         `scripts/prerender.mjs` writes it in just above this line. `npm run
         dev` therefore serves no JSON-LD — the prerendered files are what
         ships, and scripts/assert-build.sh checks them. -->
  </head>
  <body class="bg-zinc-950 text-zinc-50 antialiased selection:bg-indigo-500/30 overflow-x-hidden min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
