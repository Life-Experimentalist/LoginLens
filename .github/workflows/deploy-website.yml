name: Deploy Website to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch: # Allow manual trigger

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'website/package-lock.json'

      # npm 10, which ships with Node 22, places some transitive dependencies
      # differently and rejects the lock file as out of sync.
      - name: Pin npm
        run: npm install -g npm@12

      - name: Install dependencies
        run: npm ci
        working-directory: ./website

      - name: Build website
        run: npm run build
        working-directory: ./website
        # No VITE_BASE_URL: website/public/CNAME points Pages at the custom
        # domain loginlens.vkrishna04.me, so the site is served from the root.
        # Building with base=/LoginLens/ there would 404 every asset.

      - name: Assert the site was prerendered
        working-directory: ./website
        run: |
          # A regression that turns the build back into a plain SPA is
          # invisible in the browser and total for anything that does not run
          # JavaScript, so it gets asserted rather than eyeballed.
          for page in index docs/index decrypt/index uninstall/index 404; do
            file="dist/${page}.html"
            test -f "$file" || { echo "::error::$file was not generated"; exit 1; }
            if grep -q '<div id="root"></div>' "$file"; then
              echo "::error::$file shipped an empty root — prerender did not run"
              exit 1
            fi
          done
          test -f dist/sitemap.xml || { echo "::error::sitemap.xml missing"; exit 1; }
          test -f dist/CNAME || { echo "::error::CNAME missing — Pages would drop the custom domain"; exit 1; }
          echo "prerendered pages, sitemap and CNAME all present"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './website/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
