name: Deploy Website to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch: # Allow manual trigger

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # sitemap.xml's <lastmod> is the newest commit date of the files each
          # page renders from, so the build needs real history. A depth-1
          # checkout would stamp every page with the tip commit's date.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Active LTS, matching every other workflow here.
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'website/package-lock.json'

      # website/package-lock.json is written by npm 12. Node 24 bundles npm 11,
      # which installs it correctly; the pin keeps resolution fixed as the npm
      # bundled with Node 24 changes over that line's lifetime.
      - name: Pin npm
        run: npm install -g npm@12

      - name: Install dependencies
        run: npm ci
        working-directory: ./website

      - name: Build website
        run: npm run build
        working-directory: ./website
        # No VITE_BASE_URL: website/public/CNAME points Pages at the custom
        # domain loginlens.vkrishna04.me, so the site is served from the root.
        # Building with base=/LoginLens/ there would 404 every asset.

      # Same script CI runs on pull requests. Here it guards the exact tree
      # about to be published, rather than a tree that merely resembles it.
      - name: Assert the site was prerendered
        working-directory: ./website
        run: bash scripts/assert-build.sh

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './website/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
